name: Import Krita upstream source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-krita-source.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: krita-upstream-import
  cancel-in-progress: false

jobs:
  import:
    name: Import pinned upstream snapshot and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create import branch
        run: |
          git switch -c import/krita-upstream

      - name: Download and validate official Krita source
        env:
          UPSTREAM_SHA: f260d4523839a306f3b856b7158d5ca78b1c9b9f
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/krita-\${UPSTREAM_SHA}.tar.gz"
          SOURCE_DIR="/tmp/krita-source"
          URL="https://invent.kde.org/graphics/krita/-/archive/\${UPSTREAM_SHA}/krita-\${UPSTREAM_SHA}.tar.gz"

          curl --fail --location --retry 3 --retry-delay 3 "$URL" --output "$ARCHIVE"
          mkdir -p "$SOURCE_DIR"
          tar -xzf "$ARCHIVE" --strip-components=1 -C "$SOURCE_DIR"

          test -f "$SOURCE_DIR/CMakeLists.txt"
          test -f "$SOURCE_DIR/COPYING"
          test -d "$SOURCE_DIR/krita"
          test -d "$SOURCE_DIR/libs"
          test -d "$SOURCE_DIR/plugins"

          # GitHub rejects individual files larger than 100 MiB.
          if find "$SOURCE_DIR" -type f -size +100M -print -quit | grep -q .; then
            echo "Source snapshot contains a file larger than GitHub's 100 MiB file limit."
            exit 1
          fi

      - name: Import source snapshot
        run: |
          set -euo pipefail
          WORKFLOW_BACKUP="/tmp/import-krita-source.yml"
          cp .github/workflows/import-krita-source.yml "$WORKFLOW_BACKUP"

          rsync -a --delete --exclude='.git' /tmp/krita-source/ "$GITHUB_WORKSPACE/"

          mkdir -p .github/workflows
          cp "$WORKFLOW_BACKUP" .github/workflows/import-krita-source.yml

          mkdir -p project
          cat > project/OUR_PROJECT_DIRECTION.md <<'EOF'
          # Application direction

          This repository is the foundation for an independent digital painting application.

          ## Established decisions

          - First mobile platform: Android.
          - Interface architecture: one adaptive interface for phone, tablet, and desktop.
          - Painting technology: derived from the upstream Krita codebase.
          - Brush strategy: hybrid; retain established Krita brush engines and add a more versatile customization layer.
          - User experience reference: the accessibility and workflow patterns of ibisPaint, independently implemented.
          - Product differentiator: advanced, modular brush customization without burdening beginner workflows.

          ## Development constraints

          - Preserve upstream copyright and license notices.
          - Keep application-specific modifications identifiable and maintainable.
          - Preserve Krita document and resource compatibility wherever practical.
          - Validate the mobile canvas integration before extensive interface redevelopment.
          - This document records product intent; it does not claim that the planned features have been implemented.
          EOF

          cat > UPSTREAM_SOURCE.md <<'EOF'
          # Upstream source provenance

          This repository imports an unmodified source snapshot from the official KDE Krita project.

          - Upstream repository: https://invent.kde.org/graphics/krita
          - GitHub mirror: https://github.com/KDE/krita
          - Pinned upstream commit: f260d4523839a306f3b856b7158d5ca78b1c9b9f
          - Snapshot archive: https://invent.kde.org/graphics/krita/-/archive/f260d4523839a306f3b856b7158d5ca78b1c9b9f/krita-f260d4523839a306f3b856b7158d5ca78b1c9b9f.tar.gz

          Preserve the upstream COPYING, LICENSES, copyright notices, and all applicable license obligations. This project is independent and is not affiliated with KDE, Krita, or ibisPaint.
          EOF

          git add --all
          git commit -m "Import Krita upstream source snapshot"
          git push --set-upstream origin import/krita-upstream

      - name: Open pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = "import/krita-upstream";
            const base = "main";

            const existing = await github.rest.pulls.list({
              owner, repo, state: "open", head: \`\${owner}:\${head}\`, base
            });

            if (existing.data.length > 0) {
              core.info(\`Pull request already exists: \${existing.data[0].html_url}\`);
              core.setOutput("pull-request-url", existing.data[0].html_url);
              return;
            }

            const response = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: "Import official Krita upstream source",
              body: [
                "## Summary",
                "",
                "Imports the pinned source snapshot from the official KDE Krita repository as the initial technical foundation for this project.",
                "",
                "- **Upstream:** https://invent.kde.org/graphics/krita",
                "- **Commit:** \`f260d4523839a306f3b856b7158d5ca78b1c9b9f\`",
                "- **Project direction:** Android-first, adaptive interface, hybrid brush system.",
                "",
                "## Review notes",
                "",
                "- This is an upstream source import, not an ibisPaint code copy.",
                "- Upstream license and copyright files are retained.",
                "- Product-specific plans are documented in \`project/OUR_PROJECT_DIRECTION.md\`.",
                "- No claim is made that the application has been ported or built yet."
              ].join("\\n")
            });

            core.info(\`Created pull request: \${response.data.html_url}\`);
            core.setOutput("pull-request-url", response.data.html_url);
