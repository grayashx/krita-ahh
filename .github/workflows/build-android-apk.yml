name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - x86_64
          - armeabi-v7a

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Krita Android APK (${{ inputs.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_ABI: ${{ inputs.abi }}
      KDE_ANDROID_IMAGE: storage.kde.org/vm-images/krita-android-sdk36-2204

    steps:
      # Keep GitHub's JavaScript actions on the hosted runner. The KDE build
      # image is a build environment, not a GitHub Actions runner image.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify Docker and pull the official KDE Android builder
        run: |
          set -euo pipefail
          docker version
          docker pull "$KDE_ANDROID_IMAGE"
          docker image inspect "$KDE_ANDROID_IMAGE" >/dev/null

      - name: Build APK inside the KDE Android environment
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_packaging" "$GITHUB_WORKSPACE/build-logs"

          docker run --rm \
            --user root \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env KDECI_ANDROID_ABI="$ANDROID_ABI" \
            --env GITHUB_SHA="$GITHUB_SHA" \
            --env GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            --env GITHUB_WORKSPACE=/workspace \
            "$KDE_ANDROID_IMAGE" \
            bash -s <<'KDE_ANDROID_BUILD'
          set -Eeuo pipefail

          LOG_DIR=/workspace/build-logs
          mkdir -p "$LOG_DIR"

          on_error() {
            status=$?
            echo "::error::Krita Android build failed at line $1 (exit $status)."
            for log in "$LOG_DIR"/*.log; do
              if [[ -f "$log" ]]; then
                echo "----- Last 100 lines: $log -----"
                tail -n 100 "$log" || true
              fi
            done
            exit "$status"
          }
          trap 'on_error $LINENO' ERR

          if [[ ! -f /var/lib/ci-files/setup-environment.sh ]]; then
            echo "::error::KDE Android builder image is missing /var/lib/ci-files/setup-environment.sh"
            exit 1
          fi

          # This script defines the Android SDK, NDK, Java and toolchain paths.
          source /var/lib/ci-files/setup-environment.sh

          : "${ANDROID_HOME:?KDE image did not configure ANDROID_HOME}"
          : "${KDECI_ANDROID_NDK_ROOT:?KDE image did not configure KDECI_ANDROID_NDK_ROOT}"
          : "${KDECI_ANDROID_SDK_ROOT:?KDE image did not configure KDECI_ANDROID_SDK_ROOT}"

          test -d "$ANDROID_HOME"
          test -d "$KDECI_ANDROID_NDK_ROOT"
          test -d "$KDECI_ANDROID_SDK_ROOT"
          command -v cmake
          command -v java
          command -v python3
          java -version

          export CI_PROJECT_DIR=/workspace
          export CI_PROJECT_NAME=krita
          export CI_COMMIT_REF_NAME=master
          export CI_COMMIT_SHORT_SHA="${GITHUB_SHA:0:7}"

          export KDECI_BUILD_TYPE=Release
          export KDECI_GITLAB_SERVER=https://invent.kde.org/
          export KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD=False
          export KDECI_SKIP_ECM_ANDROID_TOOLCHAIN=True
          export KDECI_WORKDIR_PATH=/tmp/wd
          export KDECI_PACKAGE_PROJECT="teams/ci-artifacts/krita-android-$KDECI_ANDROID_ABI"
          export KDECI_REPO_METADATA_PATH=/workspace/krita-deps-management/repo-metadata
          export KDECI_EXTRA_CMAKE_ARGS="-DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=ON"
          export CMAKE_TOOLCHAIN_FILE=/workspace/krita-deps-management/tools/android-toolchain-krita.cmake
          export KRITACI_ANDROID_PACKAGE_TYPE=debug
          export KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE=True
          export KDECI_CC_CACHE="/tmp/krita-android-cache/$KDECI_ANDROID_ABI/ccache"
          export KDECI_CACHE_PATH="/tmp/krita-android-cache/$KDECI_ANDROID_ABI/artifacts"

          mkdir -p "$KDECI_WORKDIR_PATH" "$KDECI_CC_CACHE" "$KDECI_CACHE_PATH"
          git config --global --add safe.directory /workspace

          echo "==> Fetching Krita Android dependency management"
          git clone --depth 1 --branch master \
            https://invent.kde.org/packaging/krita-deps-management.git \
            /workspace/krita-deps-management
          git clone --depth 1 \
            https://invent.kde.org/packaging/krita-ci-utilities.git \
            /workspace/krita-deps-management/ci-utilities

          echo "==> Preparing Python build tools"
          python3 -m venv /tmp/krita-build-venv --upgrade-deps
          source /tmp/krita-build-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r /workspace/krita-deps-management/requirements.txt
          # The upstream CI intentionally removes VIRTUAL_ENV while retaining
          # the venv's PATH so system build tools remain discoverable.
          unset VIRTUAL_ENV

          echo "==> Generating the dependency configuration"
          python3 -u /workspace/krita-deps-management/tools/replace-branch-in-seed-file.py \
            /workspace/krita-deps-management/latest/krita-deps.yml \
            -p -o /workspace/branch-corrected-deps.yml -d master
          python3 -u /workspace/krita-deps-management/tools/generate-deps-file.py \
            -s /workspace/branch-corrected-deps.yml -o /workspace/.kde-ci.yml

          echo "==> Building Krita for Android/$KDECI_ANDROID_ABI"
          python3 -u /workspace/krita-deps-management/ci-utilities/run-ci-build.py \
            --project "$CI_PROJECT_NAME" \
            --branch "$CI_COMMIT_REF_NAME" \
            --platform "Android/$KDECI_ANDROID_ABI/Qt5/Shared" \
            --only-build --skip-publishing \
            2>&1 | tee "$LOG_DIR/build-krita.log"

          echo "==> Packaging the APK"
          python3 -u /workspace/build-tools/ci-scripts/build-android-package.py \
            2>&1 | tee "$LOG_DIR/build-apk.log"

          APK_DIR="$KDECI_WORKDIR_PATH/krita/_packaging"
          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::Krita packaging did not create $APK_DIR"
            find "$KDECI_WORKDIR_PATH/krita" -maxdepth 3 -type d -print || true
            exit 1
          fi

          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#APK_FILES[@]} -eq 0 ]]; then
            echo "::error::The packaging script completed without producing an APK."
            find "$APK_DIR" -maxdepth 4 -type f -print || true
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            echo "==> Validating APK: $apk"
            python3 -c "import sys, zipfile; z=zipfile.ZipFile(sys.argv[1]); sys.exit(1 if z.testzip() else 0)" "$apk"
            cp -v "$apk" /workspace/_packaging/
          done

          echo "==> APK build completed"
          ls -lh /workspace/_packaging/*.apk
          KDE_ANDROID_BUILD

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: krita-android-debug-${{ inputs.abi }}-${{ github.sha }}
          path: _packaging/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krita-android-build-logs-${{ github.run_id }}
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 14
