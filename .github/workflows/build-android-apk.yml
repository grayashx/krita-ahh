name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - x86_64
          - armeabi-v7a

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build debug APK (${{ inputs.abi }})
    runs-on: ubuntu-24.04
    container:
      image: storage.kde.org/vm-images/krita-android-sdk36-2204
    timeout-minutes: 360
    env:
      KDECI_ANDROID_ABI: ${{ inputs.abi }}
      KDECI_BUILD_TYPE: Release
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: "False"
      KDECI_SKIP_ECM_ANDROID_TOOLCHAIN: "True"
      KDECI_WORKDIR_PATH: /tmp/wd
      KRITACI_ANDROID_PACKAGE_TYPE: debug
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: "True"
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out this source revision
        uses: actions/checkout@v4

      - name: Prepare KDE Android build environment
        run: |
          set -euo pipefail

          if [[ ! -f /var/lib/ci-files/setup-environment.sh ]]; then
            echo "::error::The selected KDE Android image does not contain its CI setup script."
            exit 1
          fi

          source /var/lib/ci-files/setup-environment.sh

          if [[ -z "${ANDROID_HOME:-}" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [[ -z "${ANDROID_SDK_ROOT:-}" && -n "${ANDROID_HOME:-}" ]]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          if [[ -z "${ANDROID_HOME:-}" || ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK was not configured by the KDE builder image."
            env | sort | grep -E '^(ANDROID|KDECI).*ROOT|^(ANDROID_HOME|ANDROID_SDK_ROOT)=' || true
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          echo "Android ABI: $KDECI_ANDROID_ABI"
          echo "Android NDK: ${KDECI_ANDROID_NDK_ROOT:-provided by KDE toolchain}"

      - name: Build and package Krita for Android
        run: |
          set -euo pipefail
          source /var/lib/ci-files/setup-environment.sh

          if [[ -z "${ANDROID_HOME:-}" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [[ -z "${ANDROID_SDK_ROOT:-}" && -n "${ANDROID_HOME:-}" ]]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          : "${ANDROID_HOME:?Android SDK path is missing from the builder image}"

          export CI_PROJECT_DIR="$GITHUB_WORKSPACE"
          export CI_PROJECT_NAME=krita
          export CI_COMMIT_REF_NAME=master
          export CI_COMMIT_SHORT_SHA="${GITHUB_SHA:0:7}"
          export KDECI_REPO_METADATA_PATH="$GITHUB_WORKSPACE/krita-deps-management/repo-metadata"
          export KDECI_EXTRA_CMAKE_ARGS="-DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=ON"
          export CMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/krita-deps-management/tools/android-toolchain-krita.cmake"
          export KRITACI_ANDROID_PACKAGE_TYPE=debug
          export KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE=True
          export KDECI_WORKDIR_PATH=/tmp/wd
          export KDECI_PACKAGE_PROJECT="teams/ci-artifacts/krita-android-$KDECI_ANDROID_ABI"
          export KDECI_CC_CACHE="/mnt/krita-android/$KDECI_ANDROID_ABI/caches/"
          export KDECI_CACHE_PATH="/mnt/krita-android/$KDECI_ANDROID_ABI/artifacts/"

          mkdir -p "$KDECI_WORKDIR_PATH" "$KDECI_CC_CACHE" "$KDECI_CACHE_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git clone --depth 1 --branch master \
            https://invent.kde.org/packaging/krita-deps-management.git \
            krita-deps-management
          git clone --depth 1 \
            https://invent.kde.org/packaging/krita-ci-utilities.git \
            krita-deps-management/ci-utilities

          python3 -m venv venv --upgrade-deps
          source venv/bin/activate
          python -m pip install -r krita-deps-management/requirements.txt
          source venv/bin/activate
          unset VIRTUAL_ENV

          python3 -u krita-deps-management/tools/replace-branch-in-seed-file.py \
            krita-deps-management/latest/krita-deps.yml \
            -p -o branch-corrected-deps.yml -d master
          python3 -u krita-deps-management/tools/generate-deps-file.py \
            -s branch-corrected-deps.yml -o .kde-ci.yml

          python3 -u krita-deps-management/ci-utilities/run-ci-build.py \
            --project "$CI_PROJECT_NAME" \
            --branch "$CI_COMMIT_REF_NAME" \
            --platform "Android/$KDECI_ANDROID_ABI/Qt5/Shared" \
            --only-build --skip-publishing 2>&1 | tee build-krita.log

          python3 -u build-tools/ci-scripts/build-android-package.py \
            2>&1 | tee build-apk.log

          APK_DIR="$KDECI_WORKDIR_PATH/krita/_packaging"
          mkdir -p "$GITHUB_WORKSPACE/_packaging"
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)

          if [[ ${#APK_FILES[@]} -eq 0 ]]; then
            echo "::error::Krita's packaging script completed but produced no APK files."
            echo "Contents of $APK_DIR:"
            find "$APK_DIR" -maxdepth 3 -type f -print || true
            exit 1
          fi

          printf 'Found APK: %s\n' "${APK_FILES[@]}"
          cp -v "${APK_FILES[@]}" "$GITHUB_WORKSPACE/_packaging/"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: krita-android-debug-${{ inputs.abi }}-${{ github.sha }}
          path: _packaging/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krita-android-build-logs-${{ github.run_id }}
          path: |
            build-krita.log
            build-apk.log
          if-no-files-found: ignore
          retention-days: 7
