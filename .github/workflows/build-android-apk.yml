name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-apk.yml
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI
        required: true
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Krita Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_ABI: ${{ inputs.abi || 'arm64-v8a' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      # The former workflow tried to pull a KDE VM image as a Docker image.
      # Build on the Linux host using Krita's documented host-system procedure.
      - name: Reclaim preinstalled runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo apt-get clean
          echo "Runner resources after cleanup:"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install the Android SDK and NDK versions used by this project
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "KDECI_ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "KDECI_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"
          df -h "$GITHUB_WORKSPACE"

      - name: Install native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch KDE build-management tools
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master \
            https://invent.kde.org/packaging/krita-deps-management.git
          git clone --depth 1 --branch master \
            https://invent.kde.org/packaging/krita-ci-utilities.git \
            krita-deps-management/ci-utilities
          python3 -m venv "$RUNNER_TEMP/krita-build-venv"
          source "$RUNNER_TEMP/krita-build-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r krita-deps-management/requirements.txt

      - name: Prepare the official Krita Android dependency environment
        run: |
          set -eo pipefail
          source "$RUNNER_TEMP/krita-build-venv/bin/activate"
          python3 krita-deps-management/tools/setup-env.py \
            --root "$GITHUB_WORKSPACE" \
            --venv "$RUNNER_TEMP/krita-build-venv" \
            --android-abi "$ANDROID_ABI" \
            --full-krita-env
          source "$GITHUB_WORKSPACE/base-env"
          source "$GITHUB_WORKSPACE/env"
          {
            echo "KDECI_BUILD_TYPE=Release"
            echo "KDECI_EXTRA_CMAKE_ARGS=-DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=OFF"
            echo "KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD=True"
            echo "KDECI_SKIP_ECM_ANDROID_TOOLCHAIN=True"
            echo "KRITACI_PARALLEL_JOBS=2"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=2"
            echo "MAKEFLAGS=-j2"
            echo "CCACHE_MAXSIZE=1G"
            echo "CI_PROJECT_DIR=$GITHUB_WORKSPACE"
            echo "CI_PROJECT_NAME=krita"
            echo "CI_COMMIT_REF_NAME=$GITHUB_REF_NAME"
            echo "CI_COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_ENV"
          echo "Dependency environment prepared."
          df -h "$GITHUB_WORKSPACE"

      - name: Build Krita native libraries for Android
        run: |
          set -eo pipefail
          source "$GITHUB_WORKSPACE/base-env"
          source "$GITHUB_WORKSPACE/env"
          # setup-env.py deliberately excludes this override for Krita builds.
          # The generated env file re-exports it, causing a list/dict YAML merge conflict.
          unset KDECI_GLOBAL_CONFIG_OVERRIDE_PATH
          export KDECI_BUILD_TYPE=Release
          export KDECI_EXTRA_CMAKE_ARGS="-DHIDE_SAFE_ASSERTS=OFF -DBUILD_TESTING=OFF"
          export KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD=True
          export KDECI_SKIP_ECM_ANDROID_TOOLCHAIN=True
          export KRITACI_PARALLEL_JOBS=2
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          export MAKEFLAGS=-j2
          export CCACHE_MAXSIZE=1G
          export CI_PROJECT_DIR="$GITHUB_WORKSPACE"
          export CI_PROJECT_NAME=krita
          export CI_COMMIT_REF_NAME="$GITHUB_REF_NAME"
          export CI_COMMIT_SHORT_SHA="${GITHUB_SHA:0:7}"
          python3 -u krita-deps-management/ci-utilities/run-ci-build.py \
            --project krita \
            --branch master \
            --platform "Android/$ANDROID_ABI/Qt5/Shared" \
            --only-build \
            --skip-publishing 2>&1 | tee build-krita.log
          echo "Disk usage after native build:"
          df -h "$GITHUB_WORKSPACE"
          du -sh _build _install 2>/dev/null || true

      - name: Package and validate the debug APK
        run: |
          set -eo pipefail
          source "$GITHUB_WORKSPACE/base-env"
          source "$GITHUB_WORKSPACE/env"
          unset KDECI_GLOBAL_CONFIG_OVERRIDE_PATH
          export KDECI_ANDROID_ABI="$ANDROID_ABI"
          export KRITACI_ANDROID_PACKAGE_TYPE=debug
          export CI_COMMIT_SHORT_SHA="${GITHUB_SHA:0:7}"
          python3 -u build-tools/ci-scripts/build-android-package.py 2>&1 | tee build-apk.log
          mapfile -t APK_FILES < <(find _packaging -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#APK_FILES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK, found ${#APK_FILES[@]}."
            find _packaging -maxdepth 3 -type f -print || true
            exit 1
          fi
          python3 -c "import sys, zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); sys.exit(1 if bad else 0)" "${APK_FILES[0]}"
          ls -lh "${APK_FILES[0]}"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: krita-android-debug-arm64-v8a-${{ github.sha }}
          path: _packaging/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: krita-android-build-logs-${{ github.run_id }}
          path: |
            build-krita.log
            build-apk.log
          if-no-files-found: warn
          retention-days: 14
